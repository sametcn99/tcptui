name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Tests (all features)
        run: cargo test --all-features

      - name: Build release binaries
        run: cargo build --release --all-features

      - name: Smoke test tcpvcon
        run: |
          ./target/release/tcpvcon.exe --version
          ./target/release/tcpvcon.exe -a -n
          ./target/release/tcpvcon.exe -a -c -n
          ./target/release/tcpvcon.exe -a -j -n
          ./target/release/tcptui.exe --version
          ./target/release/tcptui.exe --help

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: tcptui-windows
          path: |
            target/release/tcptui.exe
            target/release/tcpvcon.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release --all-features

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "tcptui-$tag-windows-x86_64.zip"
          Compress-Archive -Path target/release/tcptui.exe, target/release/tcpvcon.exe, README.md, LICENSE -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  $zip" | Out-File -Encoding ascii sha256sums.txt
          Write-Output "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tcptui-*-windows-x86_64.zip
            sha256sums.txt
          generate_release_notes: true
